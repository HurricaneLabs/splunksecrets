name: Tests

on:
  push:
    branches:
      - "**"  # "*" skips branch names with a /
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  main-lint-test:
    runs-on: ubuntu-latest
    env:
      # uv downloads this version if the runner lacks it; without it uv uses the
      # runner's /usr/bin/python3. Not setup-python: it has no 3.9 for Ubuntu 26.04
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v5

      - name: 🚀 Install just 
        uses: extractions/setup-just@v2

      - name: 🦾 Install the project
        run: just dev-sync
          
      - name: 🐍 Check the matrix Python is the one in use
        run: uv run python -c "import sys; v = '${{ matrix.python-version }}'; assert sys.version.startswith(v + '.'), sys.version"

      - name: 💅 🧪 Check format and lint, then test
        run: just check